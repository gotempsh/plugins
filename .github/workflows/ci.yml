name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun (for plugin UIs)
        uses: oven-sh/setup-bun@v2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  typescript:
    name: TypeScript build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the reviewed SDK source until this Temps version is available on npm.
      - name: Check out Temps plugin SDK
        uses: actions/checkout@v4
        with:
          repository: gotempsh/temps
          ref: 5f552212eea78a23141e9d4381ffba3d38fbe314
          path: .temps-source

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build and link Temps plugin SDK
        working-directory: .temps-source/sdks/node
        run: |
          bun install --frozen-lockfile
          cd packages/plugin-sdk
          bun run build
          bun link

      - name: Test and build Deployment Pulse
        working-directory: deployment-pulse-plugin
        run: |
          bun link @temps-sdk/plugin
          bun run test
          bun run build
          bunx tsc --noEmit
