name: Release

# Cross-platform release builds for every tagged version.
# Creates one GitHub Release with one binary per (plugin, platform).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: x86_64-linux
            bun_target: bun-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: aarch64-linux
            linker: aarch64-linux-gnu-gcc
            bun_target: bun-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: x86_64-darwin
            bun_target: bun-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: aarch64-darwin
            bun_target: bun-darwin-arm64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check out Temps plugin SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gotempsh/temps
          ref: 5db2b56a5ecf04897ddbd1e269ec65905c48e70f
          path: .temps-source

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build all plugins
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Build and link Temps plugin SDK
        working-directory: .temps-source/sdks/node
        run: |
          bun install --frozen-lockfile
          cd packages/plugin-sdk
          bun run build
          bun link

      - name: Build Deployment Pulse
        working-directory: deployment-pulse-plugin
        run: |
          bun link @temps-sdk/plugin
          bun run embed
          bun build src/index.ts --compile --target=${{ matrix.bun_target }} --outfile=dist/temps-deployment-pulse-plugin

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p dist
          for binary in \
            temps-example-plugin \
            temps-lighthouse-plugin \
            temps-indexnow-plugin \
            temps-google-indexing-plugin
          do
            src="target/${{ matrix.target }}/release/${binary}"
            dst="dist/${binary}-${{ matrix.suffix }}"
            cp "${src}" "${dst}"
          done
          cp \
            deployment-pulse-plugin/dist/temps-deployment-pulse-plugin \
            "dist/temps-deployment-pulse-plugin-${{ matrix.suffix }}"
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugins-${{ matrix.suffix }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
