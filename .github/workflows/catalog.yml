name: Plugin catalog

on:
  pull_request:
    paths:
      - "registry/**"
      - "scripts/catalog*"
      - "scripts/safe-extract*"
      - "scripts/validate-build.sh"
      - ".github/workflows/catalog.yml"
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "scripts/catalog*"
      - "scripts/safe-extract*"
      - "scripts/validate-build.sh"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate metadata in bounded container
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=128 --memory=512m --cpus=1 --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount type=bind,src="$PWD",dst=/work,readonly --workdir /work \
            oven/bun:1.4.2@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895 bun test scripts/catalog.test.ts scripts/catalog-build.test.ts scripts/safe-extract.test.ts
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=128 --memory=512m --cpus=1 --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount type=bind,src="$PWD",dst=/work,readonly --workdir /work \
            oven/bun:1.4.2@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895 bun scripts/catalog.ts --check
      - name: Compile plugin sources in isolated containers
        run: bash scripts/validate-build.sh

  refresh:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(catalog): refresh'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile plugin sources in isolated containers
        run: bash scripts/validate-build.sh
      - name: Regenerate catalog in isolated container
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=128 --memory=512m --cpus=1 --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount type=bind,src="$PWD/registry",dst=/work/registry \
            --mount type=bind,src="$PWD/.catalog-build-plan.json",dst=/work/.catalog-build-plan.json,readonly \
            --mount type=bind,src="$PWD/scripts",dst=/work/scripts,readonly --workdir /work \
            -e CATALOG_BUILD_VERIFIED=1 \
            oven/bun:1.4.2@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895 bun scripts/catalog.ts --write
      - uses: actions/upload-artifact@v4
        with:
          name: verified-plugin-catalog
          path: registry/catalog.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: refresh
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-plugin-catalog
          path: verified-catalog
      - name: Validate artifact shape and copy data only
        run: |
          test -f verified-catalog/catalog.json
          test ! -L verified-catalog/catalog.json
          test "$(wc -c < verified-catalog/catalog.json)" -le 5242880
          jq -e '
            (.schema_version == 1 or .schema_version == 2) and
            (.generated_at | type == "string") and
            (.plugins | type == "array" and all(.[];
              (.name | type == "string") and
              (.commit | test("^[a-f0-9]{40}$")) and
              (.repository | startswith("https://github.com/")) and
              (.validation.metadata == "passed") and
              (.validation.build == "passed")
            ))
          ' verified-catalog/catalog.json
          cp verified-catalog/catalog.json registry/catalog.json
      - name: Commit generated data only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(catalog): refresh public plugin metadata'
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
          fi
