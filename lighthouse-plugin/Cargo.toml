tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
include_dir = { workspace = true }
mime_guess = { workspace = true }
thiserror = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
tempfile = "3"
